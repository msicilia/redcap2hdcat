# Neutral institutional configuration for the evaluation. ALL VALUES ARE FICTIONAL.
# Controlled-vocabulary IRIs are taken from the HealthDCAT-AP Release 8 vocabularies bundled with the
# pinned shapes (shapes/release-8/ehds/catalogue/healthcategories.rdf, publisher-type.rdf), not from the
# tool's init-config template (whose IRIs are not in the Release 8 vocabularies; see report).
base_uri: https://catalogue.fictional-institute.invalid
catalogue_title: Dataset catalogue of the Fictional Health Research Institute
catalogue_description: Fictional catalogue used only to evaluate redcap2hdcat.
language: en
access_rights: NON_PUBLIC
health_categories:
  - "https://hdeu-dcat.data.health.europa.eu/resource/authority/healthcategories/EHRS"
themes:
  - HEAL
# Fictional data-access request page (becomes the dcat:Distribution access URL).
access_url: https://www.fictional-institute.invalid/data-access-request
publisher:
  name: Fictional Health Research Institute
  email: catalogue@fictional-institute.invalid
  homepage: https://www.fictional-institute.invalid
  type: https://hdeu-dcat.data.health.europa.eu/resource/authority/publisher-type/research-institute-org
creator:
  name: Fictional Research Group
  email: group@fictional-institute.invalid
contact:
  name: Fictional Data Office
  email: data-office@fictional-institute.invalid
# dataset_type left unset: the EU dataset-type table has no concept for research data.
# Left empty as the tool intends (HDAB not designated).
hdab:
  name: ""
  email: ""
