[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "redcap2hdcat"
version = "0.1.0"
description = "Derive HealthDCAT-AP catalogue records from REDCap project metadata"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [{ name = "IMPaCT-Data2" }]
keywords = ["redcap", "healthdcat-ap", "dcat", "ehds", "metadata", "csvw", "rdf", "dmp", "snomed"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Healthcare Industry",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]

# Pure-Python dependencies only: keeps the Pyodide delivery path open (DISENO.md 4.6).
# No lxml, no pandas, no C extensions. The disposable static-site viewer (Jinja2) is a
# separate companion package, redcap2hdcat-viewer, not part of the library.
dependencies = [
    "rdflib>=7.0",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
shacl = ["pyshacl>=0.26"]
dmp = [
    "madmpy>=0.1",
]

[project.urls]
Homepage = "https://github.com/impact-data/redcap2hdcat"
Issues = "https://github.com/impact-data/redcap2hdcat/issues"

[project.scripts]
redcap2hdcat = "redcap2hdcat.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "build>=1.2",
    "twine>=5.1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/redcap2hdcat"]

[tool.hatch.build.targets.sdist]
include = ["src/", "tests/", "README.md", "LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
